[project]
name = "huntbot2"
version = "0.1.0"
description = "HuntBot 2.0 modular job automation engine"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
# Everything needed to run the full test suite in one install.
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "markdown>=3.6",
  "python-docx>=1.0",
]
browser = [
  "playwright>=1.45.0",
  "markdown>=3.6",
  "python-docx>=1.0",
]
web = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
huntbot2 = "huntbot2.cli.main:app"
huntbot2-mcp = "huntbot2.mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["huntbot2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
